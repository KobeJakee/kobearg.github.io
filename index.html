<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE LAST SIGNAL</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#ddd;font-family:Consolas,monospace}
body{min-height:100vh;background:radial-gradient(circle,#111 0,#050505 55%,#000 100%)}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.room,.terminal{max-width:800px;margin:auto;padding:60px 25px;text-align:center}
h1{letter-spacing:.15em;font-size:clamp(22px,5vw,44px)}p{line-height:1.8;color:#999}
.code{font-size:2rem;letter-spacing:.7em;margin:30px 0}
.glitch{font-size:clamp(25px,7vw,60px);font-weight:bold;letter-spacing:.12em;text-shadow:2px 0 #777,-2px 0 #333;animation:flicker 2s infinite}
.ghost{position:fixed;right:0;bottom:0;width:70px;height:70px}
.corners{height:55vh;position:relative;margin-top:30px}
.corners a{position:absolute;color:#aaa;text-decoration:none;font-size:40px;cursor:pointer}
.corners a:nth-child(1){top:0;left:0}.corners a:nth-child(2){top:0;right:0}
.corners a:nth-child(3){bottom:0;left:0}.corners a:nth-child(4){bottom:0;right:0}
pre{white-space:pre-wrap;line-height:1.8;color:#aaa;text-align:left}
.back,button{display:inline-block;margin-top:30px;border:1px solid #555;background:none;color:#ddd;padding:12px 18px;text-decoration:none;font-family:inherit;cursor:pointer}
.red{color:#aaa;font-size:1.4rem}.warning{font-size:clamp(25px,8vw,70px);letter-spacing:.1em}
.hidden{display:none}code{color:#ccc;font-size:1.1rem;word-break:break-all}
@keyframes flicker{0%,18%,20%,23%,80%,100%{opacity:1}19%,22%{opacity:.25}}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById("app");
function go(x){location.hash=x}
function layout(x){app.innerHTML=x}
function home(){layout(`<main class="center"><div class="glitch">SIGNAL RECEIVED</div><div class="code">000000</div><p>THE JOURNEY DOESN'T END HERE.</p><a class="ghost" href="#room" aria-label="Continue"></a></main>`)}
function room(){layout(`<main class="room"><h1>ROOM 0</h1><p>There are four walls.<br>There are four corners.<br>One of them is lying.<br><br>Find the torch.</p><div class="corners"><a href="#wrong">▲</a><a href="#wrong">●</a><a href="#wrong">◆</a><a href="#torch">■</a></div></main>`)}
function wrong(){layout(`<main class="center"><h1>WRONG CORNER</h1><a class="back" href="#room">TRY AGAIN</a></main>`)}
function torch(){layout(`<main class="center"><h1>YOU FOUND THE TORCH.</h1><p>THE TORCH SHOWS WHAT<br>THE LIGHT HIDES.</p><code>YXJjaGl2ZS9zaWduYWw=</code><p><a class="back" href="#archive">ARCHIVE / SIGNAL</a></p></main>`)}
function archive(){layout(`<main class="terminal"><h1>SIGNAL LOG</h1><pre>[01] 03:17 AM
[02] 03:17 AM
[03] 03:17 AM
[04] 03:17 AM
[05] 03:17 AM

Why does the clock always stop here?

...

I found Alfonso.
He doesn't remember me.

That's impossible.</pre><a class="back" href="#record">> OPEN RECORD 317</a></main>`)}
function record(){layout(`<main class="terminal"><h1>317</h1><pre>KHOOR
ZRUOG
WKHUH
LV
QR
HVFDSH</pre><button onclick="decode()">DECODE</button><p id="out"></p><a id="next" class="back hidden" href="#reveal">CONTINUE</a></main>`)}
function decode(){let s="KHOOR ZRUOG WKHUH LV QR HVFDSH";document.getElementById("out").textContent=s.replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65-3+26)%26+65));document.getElementById("next").classList.remove("hidden")}
function reveal(){layout(`<main class="center"><h1>BUT YOU WERE NEVER<br>SUPPOSED TO ESCAPE.</h1><p class="red">HELLO, ALFONSO.</p><p>You've been looking for Kobe.<br>Wrong.<br><br>Kobe has been looking for you.</p><a class="back" href="#final">THE FINAL MESSAGE</a></main>`)}
function finalPage(){layout(`<main class="center"><p id="m">HE LEFT ONE FINAL MESSAGE.</p><div id="w" class="warning">LOOK BEHIND YOU.</div><div id="b" class="hidden">01010100 01001000 01000101<br><br>01010011 01001001 01000111 01001110 01000001 01001100</div><p id="e" class="hidden">THE SIGNAL WAS NEVER SENT.</p><a id="s" class="back hidden" href="#000">000</a></main>`);setTimeout(()=>document.getElementById("w").classList.add("hidden"),2500);setTimeout(()=>document.getElementById("b").classList.remove("hidden"),3200);setTimeout(()=>document.getElementById("e").classList.remove("hidden"),5200);setTimeout(()=>document.getElementById("s").classList.remove("hidden"),6500)}
function secret(){layout(`<main class="center"><div class="glitch">000</div><h2>YOU FOUND THE END.</h2><p>OR DID YOU?</p><small>— K</small></main>`)}
function render(){let r=location.hash.slice(1)||"home";({home,room,wrong,torch,archive,record,reveal,final:finalPage,"000":secret}[r]||home)()}
addEventListener("hashchange",render);render();
</script></body></html>
